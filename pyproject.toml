[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vouch-agent"
version = "0.1.0rc1"
description = "Local-first task execution with saved runs and verifiable evidence; developer preview"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Vouch code is Apache-2.0; dependencies retain their own licenses.
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    # Pinned JAZ runtime — reviewed at upstream commit 0803d4971be785e95b80054b02259664d70fa3da
    # Upgrade requires re-running the Vouch contract tests.
    "jaz-lang==0.2.0a4",
    "typer>=0.12",
    "textual>=0.85",
]

[project.urls]
Repository = "https://github.com/JosephDeepIntelli/vouch-agent"
Issues = "https://github.com/JosephDeepIntelli/vouch-agent/issues"

[project.scripts]
vouch = "vouch_agent.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vouch_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 120
timeout_method = "thread"
markers = [
    "tui: textual TUI interaction smoke tests",
    "slow: tests allowed more wall-clock time",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "SIM117", # nested with-blocks are idiomatic for sqlite3 connections/cursors
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["vouch_agent"]
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "jaz.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src/vouch_agent"]

[tool.coverage.report]
show_missing = true
precision = 1

# The sdist is an explicit ALLOWLIST: the package, tests and synthetic
# fixtures plus the PUBLIC docs. Anything not listed (internal milestone
# records, coordination notes, AGENTS.md, local artifacts) never ships.
[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "fixtures",
  "docs/quickstart.md",
  "docs/adapter-protocol-v1.1.md",
  "docs/architecture.md",
  "pyproject.toml",
  "uv.lock",
  "README.md",
  "LICENSE",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "THIRD-PARTY-NOTICES.md",
]
